<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi IA Multimodal - Static Web</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { padding: 1.5rem; text-align: center; background-color: var(--bg-secondary); border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
    header p { color: var(--text-muted); font-size: 0.9rem; }

    .tabs { display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; }
    .tab-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0.5rem 1.25rem; border-radius: 9999px; cursor: pointer; transition: all 0.2s; font-weight: 500; }
    .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    main { flex: 1; max-width: 850px; width: 100%; margin: 1.5rem auto; padding: 0 1rem; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Chat Section */
    .chat-container { background: var(--bg-secondary); border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; height: 500px; overflow: hidden; }
    .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }
    .message { max-width: 80%; padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
    .message.user { align-self: flex-end; background: var(--accent); color: white; }
    .message.bot { align-self: flex-start; background: #334155; color: var(--text-main); }

    .input-area { display: flex; padding: 1rem; border-top: 1px solid var(--border); gap: 0.5rem; background: var(--bg-secondary); }
    input[type="text"] { flex: 1; background: var(--bg-primary); border: 1px solid var(--border); padding: 0.75rem 1rem; border-radius: 8px; color: var(--text-main); outline: none; font-size: 0.95rem; }
    input[type="text"]:focus { border-color: var(--accent); }
    
    button.btn { background: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    button.btn:hover { background: var(--accent-hover); }
    button.btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Image Section */
    .image-box { background: var(--bg-secondary); border-radius: 12px; border: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .img-preview { width: 100%; min-height: 350px; background: var(--bg-primary); border: 2px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .img-preview img { max-width: 100%; max-height: 450px; object-fit: contain; display: none; }
    .status-text { color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>🚀 Mi IA Multimodal</h1>
    <p>Chat y Generación de Imágenes 100% Cliente en GitHub Pages</p>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('chat')">💬 Asistente de Chat</button>
      <button class="tab-btn" onclick="switchTab('image')">🎨 Generador de Imágenes</button>
    </div>
  </header>

  <main>
    <!-- TAB 1: CHATBOT -->
    <div id="tab-chat" class="tab-content active">
      <div class="chat-container">
        <div class="chat-messages" id="chatBox">
          <div class="message bot">¡Hola! Soy tu asistente de IA. ¿En qué puedo ayudarte hoy?</div>
        </div>
        <div class="input-area">
          <input type="text" id="userInput" placeholder="Escribe tu consulta..." onkeydown="if(event.key==='Enter') sendMessage()">
          <button class="btn" id="sendBtn" onclick="sendMessage()">Enviar</button>
        </div>
      </div>
    </div>

    <!-- TAB 2: IMÁGENES -->
    <div id="tab-image" class="tab-content">
      <div class="image-box">
        <div class="input-area" style="padding:0; border:none; background:transparent;">
          <input type="text" id="imgPrompt" placeholder="Describe la imagen (ej: Un ciberpunk caminando por Tokio bajo la lluvia)...">
          <button class="btn" id="genBtn" onclick="generateImage()">Generar</button>
        </div>
        <div class="img-preview">
          <span class="status-text" id="imgStatus">Ingresa una descripción y haz clic en Generar</span>
          <img id="resultImg" alt="Imagen generada por IA">
        </div>
      </div>
    </div>
  </main>

  <script>
    // Control de Pestañas
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      if(tabName === 'chat') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-chat').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-image').classList.add('active');
      }
    }

    // Lógica del Chat (Pollinations Text API)
    const conversationHistory = [];

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      const sendBtn = document.getElementById('sendBtn');

      // Agregar mensaje del usuario a la pantalla
      appendMessage(text, 'user');
      input.value = '';
      sendBtn.disabled = true;

      // Mantener historial
      conversationHistory.push({ role: 'user', content: text });

      // Crear contenedor para la respuesta del bot
      const botMessageElement = appendMessage('Pensando...', 'bot');

      try {
        const response = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: 'Eres un asistente útil, claro y conciso.' },
              ...conversationHistory
            ],
            model: 'openai'
          })
        });

        const reply = await response.text();
        botMessageElement.textContent = reply;
        conversationHistory.push({ role: 'assistant', content: reply });

      } catch (error) {
        botMessageElement.textContent = 'Hubo un error al conectar con la API gratuita.';
        console.error(error);
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    // Lógica de Generación de Imagen (Pollinations Image API)
    function generateImage() {
      const promptInput = document.getElementById('imgPrompt');
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      const imgStatus = document.getElementById('imgStatus');
      const resultImg = document.getElementById('resultImg');
      const genBtn = document.getElementById('genBtn');

      genBtn.disabled = true;
      imgStatus.style.display = 'block';
      imgStatus.textContent = 'Generando imagen, por favor espera...';
      resultImg.style.display = 'none';

      // Construcción de la URL dinámica de la API de imagen
      const seed = Math.floor(Math.random() * 1000000);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=500&seed=${seed}&nologo=true`;

      // Cargar la imagen directamente en el elemento <img>
      resultImg.src = imageUrl;

      resultImg.onload = () => {
        imgStatus.style.display = 'none';
        resultImg.style.display = 'block';
        genBtn.disabled = false;
      };

      resultImg.onerror = () => {
        imgStatus.textContent = 'Error al cargar la imagen. Intenta de nuevo.';
        genBtn.disabled = false;
      };
    }
  </script>
</body>
</html>
